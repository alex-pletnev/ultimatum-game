name: ultimatum-server
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ultimatum
      POSTGRES_USER: ultimatum
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ultimatum -d ultimatum']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 256m
    networks: [internal]
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/ultimatum
      DB_USER: ultimatum
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?Set APP_CORS_ORIGINS}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/api/v1/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    networks: [internal]
  web:
    build:
      context: ../../ultimatum-game-ui
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    networks:
      internal: {}
      edge:
        aliases: [ultimatum-web]
    mem_limit: 96m
volumes:
  database:
networks:
  internal:
  edge:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK}
